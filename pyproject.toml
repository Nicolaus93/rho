[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rho"
version = "0.1.0"
description = "Phase-1 Python Temporal runtime for rho"
requires-python = ">=3.11"
dependencies = [
  "temporalio>=1.8,<2",
  "loguru>=0.7,<1",
  "textual>=0.70,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
temporal-agent-harness-worker = "rho.runtime.worker_main:main"
temporal-agent-harness-client = "rho.runtime.client_main:main"
rho = "rho.runtime.rho:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
